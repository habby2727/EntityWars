services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: entitywars_test
      POSTGRES_PASSWORD: entitywars_test_only
      POSTGRES_DB: entitywars_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitywars_test -d entitywars_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
