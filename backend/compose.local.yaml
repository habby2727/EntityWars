name: entitywars-local

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile.local
    environment:
      NODE_ENV: development
      BUN_ENV: development
      HOST: 0.0.0.0
      PORT: "8787"
      DB_PATH: /var/lib/entitywars/local.sqlite
      DATABASE_URL: postgres://entitywars:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}@postgres:5432/entitywars
      REDIS_URL: redis://redis:6379/0
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?Set TOKEN_SIGNING_SECRET in .env.local}
      EXPERIMENT_SECRET: ${EXPERIMENT_SECRET:?Set EXPERIMENT_SECRET in .env.local}
      TRADE_SECRET: ${TRADE_SECRET:?Set TRADE_SECRET in .env.local}
      WORLD_SECRET: ${WORLD_SECRET:?Set WORLD_SECRET in .env.local}
      DEV_DOCKER_LOCAL_LOGIN: "1"
      DEBUG_BYPASS: "0"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - sqlite:/var/lib/entitywars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: entitywars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: entitywars
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  sqlite:
  postgres:
  redis:
